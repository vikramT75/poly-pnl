name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cpp-tests:
    name: C++20 Core & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive\.ubuntu\.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || sleep 2; done
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends cmake ninja-build libgtest-dev libbenchmark-dev || true

      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          fi
          mkdir build && cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Debug -DPOLY_ENABLE_ASAN=ON -DPOLY_ENABLE_UBSAN=ON ..

      - name: Build
        run: |
          cd build && ninja poly_tests poly_engine_daemon

      - name: Run Tests with Sanitizers
        run: |
          cd build && ctest --output-on-failure

  python-tests:
    name: Python Ingestor & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -e ingest/

      - name: Lint with Ruff
        run: ruff check ingest/

      - name: Type check with Mypy
        run: mypy ingest/src/

      - name: Run Pytest
        run: pytest ingest/tests/ -v

  benchmarks:
    name: Microbenchmark Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Compiler
        run: g++ --version

      - name: Build Benchmarks
        run: |
          g++ -std=c++20 -O3 -march=native -Icore/include bench/decoder_bench.cpp core/src/decoder/decoder.cpp -o bench_decoder
          g++ -std=c++20 -O3 -march=native -Icore/include bench/engine_bench.cpp core/src/engine/engine.cpp -o bench_engine
          g++ -std=c++20 -O3 -march=native -Icore/include bench/hashmap_bench.cpp core/src/engine/engine.cpp -o bench_hashmap

      - name: Execute Benchmarks
        run: |
          ./bench_decoder
          ./bench_engine
          ./bench_hashmap
