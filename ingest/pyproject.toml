[project]
name = "poly-ingest"
version = "0.1.0"
description = "High-performance real-time ingestion layer for Polymarket on Polygon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "orjson>=3.10.0",
    "aiohttp>=3.9.5",
    "websockets>=12.0",
    "clickhouse-connect>=0.7.16",
    "prometheus-client>=0.20.0",
    "hypersync>=0.4.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
]

[project.scripts]
poly-ingest = "poly_ingest.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "PIE",
]
ignore = [
    "E501",
    "B008",
    "BLE001",
    "S110",
    "S112",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_subclassing_any = false
